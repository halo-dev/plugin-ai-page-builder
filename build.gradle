plugins {
    id 'java'
    id "io.freefair.lombok" version "9.2.0"
    id "run.halo.plugin.devtools" version "0.8.0"
}

group 'run.halo.aipagebuilder'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.26.0')
    compileOnly 'run.halo.app:api'
    compileOnly 'run.halo.aifoundation:api:1.1.1'
    implementation 'org.jsoup:jsoup:1.22.1'
    implementation('com.helger:ph-css:8.2.2') {
        // Halo provides SLF4J. A second API breaks provider binding across plugin class loaders.
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    testImplementation 'run.halo.aifoundation:api:1.1.1'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
}

tasks.named('generatePluginComponentsIdx') {
    notCompatibleWithConfigurationCache('This task invokes "Task.project" at execution time, which is not supported with configuration cache.')
}

halo {
    version = '2.26'
}

haloPlugin {
    openApi {
        outputDir = file("${buildDir}/openapi")
        groupingRules {
            aiPageBuilderApis {
                displayName = 'AI Page Builder APIs'
                pathsToMatch = ['/apis/console.api.aipagebuilder.halo.run/**']
            }
        }
        groupedApiMappings = ['/v3/api-docs/aiPageBuilderApis': 'aiPageBuilderApis.json']
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
            additionalProperties = [
                useES6: true,
                useSingleRequestParameter: true,
                withSeparateModelsAndApi: true,
                apiPackage: 'api',
                modelPackage: 'models'
            ]
            typeMappings = [set: 'Array']
        }
    }
}

tasks.register('processUiResources', Sync) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/ui')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}
