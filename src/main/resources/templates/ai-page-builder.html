<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
      th:replace="~{layout :: html(head=~{::pageHead}, content=~{::pageBody})}">
<th:block th:fragment="pageHead">
  <title th:text="${aiPageBuilder.title}"></title>
  <meta name="description" th:content="${aiPageBuilder.description}">
  <style th:utext="${aiPageBuilder.css}"></style>
</th:block>
<th:block th:fragment="pageBody">
  <div th:if="${aiPageBuilder.scriptBlocked}" role="note"
       style="position:relative;z-index:2147483647;padding:12px 16px;background:#fff7e6;border-bottom:1px solid #ffd591;color:#874d00;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;text-align:center">
    你以超级管理员身份访问，页面脚本已停用。请通过预览或无痕窗口查看访客效果。
  </div>
  <!-- Render the full html contract: body markup followed by its script bootstrap, if any. -->
  <div th:id="${aiPageBuilder.rootId}" th:utext="${aiPageBuilder.html}"></div>
</th:block>
</html>
